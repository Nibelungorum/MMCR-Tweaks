name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: MMCR-Tweaks
          fetch-depth: 0
          fetch-tags: true

      - name: Checkout matching MMCR sources
        uses: actions/checkout@v4
        with:
          repository: Nibelungorum/ModularMachinery-Community-Refoxed
          ref: 1eb11da9a5a3b570d1d5532220c8e70bf1a1eeb5
          path: mmcr-1.21.1

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build local MMCR dependency
        run: gradle -p mmcr-1.21.1 jar

      - name: Build and run ECO GameTests
        working-directory: MMCR-Tweaks
        run: |
          gradle build runGameTestServer
          grep -Eq 'All [1-9][0-9]* required tests passed' run/gameTestServer/logs/latest.log
